name: Java Fix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  setup-java:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17 (Root Fix)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Verify Java 17
      shell: bash
      run: |
        set -e
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        
        JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
        
        if [ "$JAVA_MAJOR" -lt 17 ]; then
          echo "ERROR: Java version is lower than 17"
          exit 1
        fi
        
        echo "Java 17 verified successfully."
