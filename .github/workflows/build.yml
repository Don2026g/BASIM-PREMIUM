name: Android CI and Java Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود الحالي للمشروع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. تثبيت بيئة Flutter لتوليد مجلد أندرويد المفقود
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 3. الحل الجذري: إنشاء مجلد أندرويد وملفاته إذا كانت مفقودة في GitHub
    - name: Generate Android Directory
      run: |
        if [ ! -d "android" ]; then
          echo "Android folder missing. Creating it now..."
          flutter create --platforms=android --project-name=basim_one_iptv .
        fi

    # 4. تثبيت جافا 17 الآن بنجاح وبدون أي كاش معطل
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 5. التحقق النهائي من الجافا في بيئة نظيفة ومكتملة
    - name: Verify Java 17
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
