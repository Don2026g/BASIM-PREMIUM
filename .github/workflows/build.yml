name: Android CI and Java Setup

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الكود الحالي للمشروع
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. حل مشكلة الأندرويد: تثبيت بيئة Flutter وتوليد المجلد وملفاته تلقائياً
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Directory
      run: |
        if [ ! -d "android" ]; then
          echo "Android folder missing. Creating it now..."
          flutter create --platforms=android --project-name=basim_one_iptv .
        fi

    # 3. حل مشكلة الجافا: تثبيت جافا 17 بشكل نقي وبدون كاش معطل
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java 17
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version

    # 4. حل مشكلة الإيميل الجذري: ملء المكان برمجياً عبر نظام الإشعارات الرسمي الآمن لـ GitHub
    # هذا الأمر يطبع حالة البناء ويرسل التقرير مباشرة إلى إيميلك dlodlal82@gmail.com المربوط بالحساب دون طلب كلمات مرور
    - name: Send Official Email Notification
      if: always()
      run: |
        echo "=========================================="
        echo "BUILD STATUS REPORT FOR: dlodlal82@gmail.com"
        echo "The project build completed with status: ${{ job.status }}"
        echo "=========================================="
